<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now Playing</title>
<style>
  :root { --gap: 4vmin; --fg: #f2f2f4; --muted: #9aa0aa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #0a0a0c; color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
  }
  #bg {
    position: fixed; inset: -8%; background-size: cover;
    background-position: center; transform: scale(1.1);
    filter: blur(40px) saturate(1.3) brightness(0.5);
    transition: background-image .6s ease; z-index: 0;
  }
  #bg::after { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.2), rgba(0,0,0,.7)); }
  #stage {
    position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; gap: var(--gap); padding: var(--gap);
  }
  #coverWrap {
    height: 100%; aspect-ratio: 1/1; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  #cover {
    max-height: 100%; max-width: 100%; aspect-ratio: 1/1;
    object-fit: contain; border-radius: 2vmin;
    box-shadow: 0 1vmin 4vmin rgba(0,0,0,.6);
    transition: opacity .5s ease; background: #1a1a1f;
  }
  #info {
    flex: 1 1 auto; min-width: 0; height: 100%;
    display: flex; flex-direction: column; padding: 2vmin 1vmin;
  }
  #feed { font-size: 2.4vmin; letter-spacing: .25em;
          text-transform: uppercase; color: var(--muted); }
  #feedrow { display: flex; align-items: center; gap: 2vmin; }
  #playstate { font-size: 2vmin; letter-spacing: .15em; text-transform: uppercase; }
  #playstate.playing { color: #5fae8c; }
  #playstate.paused { color: #f2b705; font-weight: 600; }
  #title { font-size: 5.5vmin; font-weight: 700; line-height: 1.05; margin-top: 1vmin; }
  #artist { font-size: 4vmin; font-weight: 400; color: #d2d4da; margin-top: 1vmin; }
  #album { font-size: 2.8vmin; color: var(--muted); margin-top: 1.5vmin; }
  #details { font-size: 2.4vmin; color: #6f757f; margin-top: 0.6vmin;
             letter-spacing: .03em; }
  #description { font-size: 2.4vmin; color: #c2c6cf; line-height: 1.5;
                 margin-top: 2.4vmin; max-width: 56vmin; white-space: pre-line; }
  .spacer { flex: 1 1 auto; }
  .rlabel { letter-spacing: .04em; }
  #ratingVal { color: var(--fg); font-weight: 600; font-size: 3.6vmin; }
  .rsub { font-size: 2.2vmin; color: #6f757f; margin-left: 1.5vmin; }
  #ratingChart { display: flex; align-items: flex-end; gap: 0.6vmin;
                 height: 8vmin; width: 40vmin; max-width: 100%; }
  #ratingChart .bar { flex: 1 1 0; min-height: 2%; border-radius: 0.4vmin 0.4vmin 0 0; }
  #ratingLabels { display: flex; gap: 0.6vmin; width: 40vmin; max-width: 100%;
                  padding: 0.3vmin 0 0.4vmin; margin-bottom: 1vmin; }
  #ratingLabels span { flex: 1 1 0; text-align: center; font-size: 1.1vmin; color: #6f757f; }
  #ratingRow { display: flex; align-items: baseline; gap: 1.2vmin;
               font-size: 2.6vmin; color: var(--muted); width: 40vmin; justify-content: center; }
  #controls { display: none; gap: 2vmin; margin-top: 3vmin; }
  #rightbar {
    flex: 0 0 auto; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
    gap: 1.5vmin;
    padding: 1.6vmin 1vmin 1.6vmin 1vmin;
    width: calc(15vmin + var(--gap));
    margin-right: calc(-1 * var(--gap));
    margin-bottom: calc(-1 * var(--gap));
    background: rgba(12,12,16,.78);
    border-left: 1px solid rgba(255,255,255,.07);
  }
  .status-tile {
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7vmin; padding: 1.3vmin 0.4vmin;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.6vmin; color: #8b909a; font: inherit; cursor: default;
  }
  .status-tile.clickable { cursor: pointer; transition: background .12s ease, transform .1s ease; }
  .status-tile.clickable:active { transform: scale(.94); }
  .status-tile svg { width: 5vmin; height: 5vmin; stroke: currentColor; fill: none;
                     stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .status-tile .tile-lbl { font-size: 1.7vmin; letter-spacing: .02em; color: #8b909a; }
  .status-tile .tile-state { font-size: 1.9vmin; font-weight: 600; color: #8b909a; }
  .status-tile.locked { color: #5fae8c; }
  .status-tile.locked .tile-lbl { color: #c2c6cf; }
  .status-tile.locked .tile-state { color: #5fae8c; }
  .status-tile.unlocked { color: #f2b705; border-color: rgba(242,183,5,.45); }
  .status-tile.unlocked .tile-lbl { color: #c2c6cf; }
  .status-tile.unlocked .tile-state { color: #f2b705; }
  .status-tile.charging { color: #f2b705; }
  .status-tile.charging .tile-lbl { color: #c2c6cf; }
  .status-tile.charging .tile-state { color: #f2b705; }
  .status-tile.dev-on { color: #d9dce2; background: rgba(95,174,140,.18); border-color: rgba(95,174,140,.55); }
  .status-tile.dev-on .tile-lbl { color: #9de0c0; }
  .status-tile.dev-on .tile-state { color: #9de0c0; }
  .status-tile.link { color: #6fc2a4; cursor: pointer; transition: background .12s ease, transform .1s ease; }
  .status-tile.link:active { transform: scale(.94); background: rgba(111,194,164,.18); }
  .status-tile.link .tile-lbl { color: #c2c6cf; }
  .status-tile.link .tile-state { color: #6fc2a4; font-weight: 500; }
  #lrOverlay {
    position: fixed; inset: 0; z-index: 20; background: #0e1014;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #lrOverlay.show { opacity: 1; pointer-events: auto; }
  #lrOverlay iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #lrClose {
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none;
    position: absolute; z-index: 1; top: 1.6vmin; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1vmin;
    padding: 1.2vmin 2.6vmin; border-radius: 999px;
    background: rgba(12,12,16,.88); border: 1px solid rgba(255,255,255,.14);
    color: #c2c6cf; font: inherit; font-size: 2vmin; letter-spacing: .04em; cursor: pointer;
    box-shadow: 0 .6vmin 2vmin rgba(0,0,0,.5);
  }
  #lrClose:active { transform: translateX(-50%) scale(.94); }
  #lrClose svg { width: 2.6vmin; height: 2.6vmin; stroke: currentColor; fill: none;
                 stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #skipBanner {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%) scale(.96);
    background: rgba(20,14,4,.94); border: 2px solid rgba(242,183,5,.65);
    padding: 3.2vmin 5.5vmin; border-radius: 2vmin;
    max-width: 82vmin; text-align: center;
    box-shadow: 0 2vmin 6vmin rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
    display: flex; flex-direction: column; align-items: center; gap: 1vmin;
  }
  #skipBanner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #skipBanner .skip-label {
    font-size: 2.1vmin; font-weight: 700; letter-spacing: .25em;
    text-transform: uppercase; color: #c98f1f;
  }
  #skipBanner .skip-title {
    font-size: 4.6vmin; font-weight: 700; line-height: 1.2; color: #f2b705;
  }
  #skipBanner .skip-artist {
    font-size: 3.2vmin; font-weight: 400; color: #e0c274;
  }
  #skipBanner .skip-reason {
    margin-top: 1.2vmin; font-size: 2vmin; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: #1a1408;
    background: #f2b705; padding: 0.7vmin 2vmin; border-radius: 999px;
  }
  /* Night screen: covers everything (incl. scenebar) when now-playing posts stop.
     Everything stays deliberately dim so it doesn't light up the room: a slow
     aurora of deep colour, faint stars, and a gradient clock with a moon. */
  #night {
    position: fixed; inset: 0; z-index: 10; background: #010103; overflow: hidden;
    transition: opacity 1.4s ease;
  }
  #night.hidden { opacity: 0; pointer-events: none; }
  #night.hidden * { animation-play-state: paused !important; }
  .aurora { position: absolute; border-radius: 50%; will-change: transform; }
  .aurora.a1 { width: 90vmax; height: 70vmax; left: -30vmax; top: -35vmax;
    background: radial-gradient(closest-side, rgba(58,40,140,.30), rgba(58,40,140,0));
    animation: drift1 95s ease-in-out infinite alternate; }
  .aurora.a2 { width: 80vmax; height: 80vmax; right: -35vmax; bottom: -45vmax;
    background: radial-gradient(closest-side, rgba(10,96,104,.24), rgba(10,96,104,0));
    animation: drift2 120s ease-in-out infinite alternate; }
  .aurora.a3 { width: 60vmax; height: 50vmax; left: 30vmax; top: 10vmax;
    background: radial-gradient(closest-side, rgba(110,28,90,.16), rgba(110,28,90,0));
    animation: drift3 140s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(30vmax, 18vmax) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-28vmax, -20vmax) scale(.85); } }
  @keyframes drift3 { 0% { transform: translate(0,0) } 50% { transform: translate(-25vmax, 15vmax) scale(1.3) }
                      100% { transform: translate(10vmax, -12vmax) scale(.9) } }
  #nightStars { position: absolute; inset: 0; }
  #nightStars i { position: absolute; border-radius: 50%; background: #b8c0ff;
    opacity: 0; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .04; } 50% { opacity: var(--o, .3); } }
  #nightInner {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    transition: left 6s ease, top 6s ease; white-space: nowrap;
  }
  #nightGreet { display: flex; align-items: center; gap: 1.6vmin;
    font-size: 2.4vmin; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
    color: #3b3f5c; }
  #nightMoon { width: 4.2vmin; height: 4.2vmin; filter: drop-shadow(0 0 1.2vmin rgba(150,160,230,.18)); }
  #nightTime { font-size: 20vmin; font-weight: 100; line-height: 1; margin-top: .6vmin;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    background: linear-gradient(170deg, #6a6f96 10%, #3a3d5e 55%, #2a3550 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 3vmin rgba(90,100,200,.14)); }
  #nightSweep { position: relative; width: 100%; height: 1px; margin: 8.4vmin 0 0;
    background: linear-gradient(90deg, transparent, #1d1f30 15%, #1d1f30 85%, transparent); }
  #nightSweep b { position: absolute; inset: 0; animation: sweep 60s linear infinite; }
  /* Seconds marker: a little espresso cup riding the line, steam curling up. */
  #nightSweep .cup { position: absolute; left: 0; bottom: -.7vmin; width: 9vmin; height: 9vmin;
    margin-left: -4.5vmin; filter: drop-shadow(0 0 1.4vmin rgba(214,160,100,.22)); }
  #nightSweep .cup svg { width: 100%; height: 100%; overflow: visible; fill: none; stroke: #9a7c5e;
    stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
  #nightSweep .cup .body { fill: #2a1a10; }
  #nightSweep .cup .crema { fill: #7a5232; stroke: none; }
  #nightSweep .cup .steam { stroke: #8a7a6a; stroke-width: 1.1; opacity: 0;
    animation: steam 3.6s ease-out infinite; }
  #nightSweep .cup .steam.s2 { animation-delay: 1.2s; }
  #nightSweep .cup .steam.s3 { animation-delay: 2.4s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(1px); }
                     30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-3.5px); } }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(100%); } }
  #nightDate { margin-top: 1.2vmin; font-size: 3.2vmin; font-weight: 300; letter-spacing: .22em;
    text-transform: uppercase; color: #343850; }
  /* Status is the one thing read from across the room, so it's big and a
     notch brighter than the rest. */
  #nightHome { margin-top: 6vmin; display: flex; flex-direction: column;
    align-items: center; gap: 1.6vmin; font-size: 3.6vmin; font-weight: 500;
    letter-spacing: .02em; }
  #nightHome .row { display: flex; gap: 1.6vmin; }
  #nightHome .chip { display: flex; align-items: center; gap: 1.2vmin;
    padding: 1vmin 2.2vmin 1vmin 1.8vmin; border-radius: 999px;
    color: #6a7090; background: rgba(120,130,200,.05);
    border: 1px solid rgba(120,130,200,.12); }
  #nightHome .chip svg { width: 3.6vmin; height: 3.6vmin; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #nightHome .chip.on { color: #45a88e; border-color: rgba(69,168,142,.3);
    background: rgba(69,168,142,.08); }
  #nightHome .chip.warn { color: #d39a32; border-color: rgba(200,140,40,.28);
    background: rgba(200,140,40,.07); animation: warnGlow 3.2s ease-in-out infinite; }
  @keyframes warnGlow { 50% { box-shadow: 0 0 2.4vmin rgba(200,140,40,.18); } }
  #nightLinks { position: absolute; bottom: 3vmin; left: 0; right: 0;
    display: flex; justify-content: center; gap: 1.6vmin; }
  #nightLinks a { -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 1vmin; padding: 1.3vmin 2.2vmin 1.3vmin 1.8vmin;
    border-radius: 999px; text-decoration: none; font-size: 2.8vmin; letter-spacing: .04em;
    color: #59608a; background: rgba(120,130,200,.04); border: 1px solid rgba(120,130,200,.09);
    transition: transform .1s ease, background .12s ease, color .12s ease; }
  #nightLinks a:active { transform: scale(.94); background: rgba(120,130,200,.14); color: #8a90b8; }
  #nightLinks svg { width: 3vmin; height: 3vmin; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #nightHint { position: absolute; bottom: 5.2vmin; right: 3.6vmin;
    font-size: 1.6vmin; letter-spacing: .4em; text-transform: uppercase; color: #1c1d28;
    animation: hint 6s ease-in-out infinite; }
  @keyframes hint { 50% { color: #2a2c3c; } }
  #scenebar {
    flex: 0 0 auto; z-index: 3;
    display: flex; align-items: stretch; justify-content: center; gap: 3vmin;
    padding: 1.6vmin 2vmin;
    background: rgba(12,12,16,.78);
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .scene-group { display: flex; gap: 1.4vmin; }
  .scene-group + .scene-group {
    border-left: 1px solid rgba(255,255,255,.12); padding-left: 3vmin; }
  .scene-btn {
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7vmin; width: 14.5vmin; padding: 1.3vmin 0.4vmin;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.6vmin; color: #d9dce2; cursor: pointer; font: inherit;
    transition: background .12s ease, transform .1s ease, border-color .12s ease;
  }
  .scene-btn:active { transform: scale(.94); }
  .scene-btn.flash { background: rgba(95,174,140,.45); border-color: rgba(95,174,140,.75); }
  .scene-btn.active { background: rgba(95,174,140,.18); border-color: rgba(95,174,140,.55); }
  .scene-btn.active .lbl { color: #9de0c0; }
  .scene-btn svg { width: 5vmin; height: 5vmin; stroke: currentColor; fill: none;
                   stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* default: grey bulb (devices off or unknown) */
  .scene-btn { color: #8b909a; }
  .scene-btn .lbl { font-size: 1.9vmin; letter-spacing: .02em; color: #8b909a; }
  /* any device in scene is on: white bulb */
  .scene-btn.any-on { color: #d9dce2; }
  .scene-btn.any-on .lbl { color: #c2c6cf; }
</style>
</head>

        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        <span class="lbl">Kitchen Off</span>
      </button>
      <button class="scene-btn" data-scene="relax">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">LR Relax</span>
      </button>
      <button class="scene-btn" data-scene="meditate">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">LR Meditate</span>
      </button>
      <button class="scene-btn" data-scene="lr_off">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        <span class="lbl">LR Off</span>
      </button>
    </div>
    <div class="scene-group">
      <button class="scene-btn" data-scene="shades_open">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="2.5" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="6.5" x2="19" y2="6.5" stroke-width="2"/></svg>
        <span class="lbl">Open</span>
      </button>
      <button class="scene-btn" data-scene="shades_partial">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="8" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="12" x2="19" y2="12" stroke-width="2"/></svg>
        <span class="lbl">Partial</span>
      </button>
      <button class="scene-btn" data-scene="shades_closed">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="15" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="19" x2="19" y2="19" stroke-width="2"/></svg>
        <span class="lbl">Closed</span>
      </button>
    </div>
  </div>
<script>
  const POLL_MS = 3000;
  // KM posts every 5s (RP) / 8s (AM) while logged in. If none arrive for this
  // long, assume the feed is gone and switch to the dark night screen.
  const STALE_S = 30;
  // RP keeps posting while paused (playing:false), so also go dark once
  // playback has been paused this long.
  const PAUSED_NIGHT_MS = 15 * 1000;
  let pausedSince = null;
  const WAKE_MS = 45 * 1000;   // tap on night screen shows controls this long
  // With music stopped, an untouched Living Room overlay closes back to night after this long.
  const LR_IDLE_MS = 2 * 60 * 1000;
  let lastCover = null;

  function setBg(url){
    document.getElementById('bg').style.backgroundImage = 'url("' + url + '")';
  }

  function setText(id, val){
    const el = document.getElementById(id);
    el.textContent = val || '';
    el.style.display = val ? '' : 'none';
  }

  const BAR_COLORS = [
    'rgb(78,121,167)',  // 1
    'rgb(242,142,43)',  // 2
    'rgb(225,87,89)',   // 3
    'rgb(118,183,178)', // 4
    'rgb(89,161,79)',   // 5
    'rgb(237,201,72)',  // 6
    'rgb(176,122,161)', // 7
    'rgb(255,157,167)', // 8
    'rgb(156,117,95)',  // 9
    'rgb(186,176,172)', // 10
  ];

  let lastDist = '';
  function renderChart(dist){
    const el = document.getElementById('ratingChart');
    const lblEl = document.getElementById('ratingLabels');
    if(!dist || !dist.length){
      el.style.display = 'none'; el.innerHTML = '';
      lblEl.style.display = 'none'; lblEl.innerHTML = '';
      return;
    }
    el.style.display = ''; lblEl.style.display = '';
    const max = Math.max.apply(null, dist.map(d => d.count || 0)) || 1;
    el.innerHTML = dist.map(d => {
      const h = Math.max(2, Math.round((d.count || 0) / max * 100));
      const color = BAR_COLORS[(d.n || 1) - 1] || d.color || '#888';
      return '<div class="bar" style="height:' + h + '%;background-color:' + color + '"></div>';
    }).join('');
    lblEl.innerHTML = dist.map(d => '<span>' + (d.n || '') + '</span>').join('');
  }

  let lastSkipAt = 0;
  let skipBannerTimer = null;
  const SKIP_BANNER_MS = 7000;

  const SKIP_REASON_TEXT = {
    banned_artist: 'Banned Artist',
    banned_title: 'Banned Track',
    banned: 'Banned',
  };
  function showSkipBanner(skip){
    const el = document.getElementById('skipBanner');
    const why = skip.reason === 'rating'
      ? 'Rated ' + skip.rating + '/10'
      : (SKIP_REASON_TEXT[skip.reason] || 'Skipped');
    el.querySelector('.skip-title').textContent = skip.title || '';
    el.querySelector('.skip-artist').textContent = skip.artist || '';
    el.querySelector('.skip-reason').textContent = why;
    el.classList.add('show');
    playChime();
    clearTimeout(skipBannerTimer);
    skipBannerTimer = setTimeout(() => el.classList.remove('show'), SKIP_BANNER_MS);
  }

  async function poll(){
    let s;
    try { s = await (await fetch('/nowplaying', {cache:'no-store'})).json(); }
    catch(e){ return; }
    if(s && s.last_skip && s.last_skip.at && s.last_skip.at !== lastSkipAt){
      lastSkipAt = s.last_skip.at;
      showSkipBanner(s.last_skip);
    }
    const live = s && s.cover_url && s.age !== null && s.age < STALE_S;
    if(live && s.playing === false) pausedSince = pausedSince || Date.now();
    else pausedSince = null;
    const longPaused = pausedSince !== null && Date.now() - pausedSince >= PAUSED_NIGHT_MS;
    setNight(!live || longPaused);
    if(!live) return;
    if(s.cover_url !== lastCover){
      const img = document.getElementById('cover');
      img.style.opacity = 0;
      const next = new Image();
      next.onload = () => { img.src = s.cover_url; setBg(s.cover_url); img.style.opacity = 1; };
      next.src = s.cover_url;
      lastCover = s.cover_url;
    }
    setText('feed', s.feed);
    const ps = document.getElementById('playstate');
    if (s.playing === true) {
      ps.textContent = '\u25B6 Playing'; ps.className = 'playing'; ps.style.display = '';
    } else if (s.playing === false) {
      ps.textContent = '\u23F8 Paused'; ps.className = 'paused'; ps.style.display = '';
    } else {
      ps.style.display = 'none';
    }
    setText('artist', s.artist);
    setText('title', s.title);
    setText('album', s.album);
    const det = [s.released, s.length].filter(Boolean).join('  \u00b7  ');
    setText('details', det);
    setText('description', s.description);
    const r = s.rating;
    document.getElementById('ratingVal').textContent =
      (r === null || r === '' || r === undefined) ? '\u2014' : r;
    const avg = s.avg_rating
      ? ('avg ' + s.avg_rating + (s.num_ratings ? ' (' + s.num_ratings + ')' : ''))
      : '';
    document.getElementById('avgWrap').textContent = avg;
    const hasRating = !(r === null || r === '' || r === undefined);
    document.getElementById('ratingRow').style.display =
      (hasRating || s.avg_rating) ? '' : 'none';
    const distKey = JSON.stringify(s.rating_dist || []);
    if(distKey !== lastDist){ renderChart(s.rating_dist); lastDist = distKey; }
  }

  // --- Night screen ---
  const night = document.getElementById('night');
  let isNight = false, wakeUntil = 0, savedBrightness = null;
  // feedNight: driven by the now-playing poll. manualNight: someone asked for
  // the night screen (?night=1, or the Living Room controller's link); it holds
  // even while music plays, until the screen is tapped.
  let feedNight = false, manualNight = /[?&]night=1\b/.test(location.search);

  // Fully Kiosk JS interface (Settings > Advanced Web Settings > Enable
  // JavaScript Interface). Without it, night mode is just the black page.
  function setBacklight(dim){
    if(!window.fully) return;
    try {
      if(dim){
        if(savedBrightness === null) savedBrightness = fully.getScreenBrightness();
        fully.setScreenBrightness(8);
      } else if(savedBrightness !== null){
        fully.setScreenBrightness(savedBrightness);
        savedBrightness = null;
      }
    } catch(e){}
  }

  function applyNight(){
    const show = isNight && Date.now() >= wakeUntil;
    night.classList.toggle('hidden', !show);
    // Full brightness while the Living Room overlay is up on top of the night screen.
    setBacklight(show && !document.getElementById('lrOverlay').classList.contains('show'));
  }

  function setNight(on){
    // Music just started while the Living Room overlay is up: back to now playing.
    if(feedNight && !on) document.getElementById('lrOverlay').classList.remove('show');
    feedNight = on;
    const eff = feedNight || manualNight;
    if(eff && !isNight) lastCover = null;  // repaint art when the feed resumes
    isNight = eff;
    if(!eff) wakeUntil = 0;
    applyNight();
  }

  function enterNight(){
    manualNight = true;
    wakeUntil = 0;
    setNight(feedNight);
  }

  night.addEventListener('click', () => {
    if(manualNight){
      manualNight = false;
      setNight(feedNight);
      if(!isNight) return;
    }
    wakeUntil = Date.now() + WAKE_MS;
    applyNight();
    setTimeout(applyNight, WAKE_MS + 50);
  });

  // Light group: on if any member is on; unknown if no member has reported.
  function groupOn(keys){
    const ds = keys.map(k => hkState[k]).filter(Boolean);
    return ds.length ? ds.some(d => d.on) : null;
  }

  function shadesState(){
    const ds = ['cover_lr','cover_ll','cover_rr','cover_rl'].map(k => hkState[k]).filter(Boolean);
    if(!ds.length) return null;
    const avg = ds.reduce((a, d) => a + (d.bri || 0), 0) / ds.length;
    return avg >= 90 ? 'open' : avg <= 10 ? 'closed' : 'partly open';
  }

  const NIGHT_ICONS = {
    lock:   '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    unlock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
    garage: '<path d="M3 10l9-6 9 6v11H3z"/><path d="M7 21v-8h10v8M7 16h10"/>',
    car:    '<path d="M4 16v-3l1.8-4.2A2 2 0 0 1 7.6 7.5h8.8a2 2 0 0 1 1.8 1.3L20 13v3z"/><path d="M4 13h16"/><circle cx="7.5" cy="16.5" r="1.7"/><circle cx="16.5" cy="16.5" r="1.7"/>',
    bulb:   '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    shades: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 13h18"/>',
    drop:   '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  };

  function updateNightHome(){
    const one = (key, fn) => { const d = hkState[key]; return fn(d ? d.on : null); };
    const lit = (label, on) => on === null ? ['bulb', label + ' \u2014', '']
                             : on ? ['bulb', label + ' on', 'on'] : ['bulb', label + ' off', ''];
    const shades = shadesState();
    const rows = [
      [
        one('lock_front', on => on === null ? ['lock', 'Door \u2014', ''] : on ? ['lock', 'Door locked', ''] : ['unlock', 'Door unlocked', 'warn']),
        one('garage',     on => on === null ? ['garage', 'Garage \u2014', ''] : on ? ['garage', 'Garage open', 'warn'] : ['garage', 'Garage closed', '']),
        one('charge',     on => on === null ? ['car', 'Car \u2014', ''] : on ? ['car', 'Car charging', 'on'] : ['car', 'Car not charging', '']),
      ],
      [
        lit('Kitchen', groupOn(['lutron_4', 'lutron_3'])),
        lit('Living room', groupOn(['hue_8', 'hue_15'])),
        lit('Bedroom', groupOn(['bedroom'])),
        ['shades', shades === null ? 'Shades \u2014' : 'Shades ' + shades, ''],
      ],
    ];
    if(hkState.leak && hkState.leak.on) rows.unshift([['drop', 'Water leak detected', 'warn']]);
    document.getElementById('nightHome').replaceChildren(...rows.map(items => {
      const row = document.createElement('div');
      row.className = 'row';
      row.append(...items.map(([icon, txt, cls]) => {
        const chip = document.createElement('span');
        chip.className = 'chip' + (cls ? ' ' + cls : '');
        chip.innerHTML = '<svg viewBox="0 0 24 24">' + NIGHT_ICONS[icon] + '</svg><span></span>';
        chip.lastChild.textContent = txt;
        return chip;
      }));
      return row;
    }));
    placeNight(false);
  }

  // Living Room controller link along the bottom of the night screen. Tapping it
  // doesn't wake to the music page; tapping anywhere else does.
  const NIGHT_LINKS = [
    {label: 'Living Room', open: () => document.getElementById('lrOpen').click(),
     icon: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'},
  ];
  document.getElementById('nightLinks').replaceChildren(...NIGHT_LINKS.map(l => {
    const a = document.createElement('a');
    a.innerHTML = '<svg viewBox="0 0 24 24">' + l.icon + '</svg><span></span>';
    a.lastChild.textContent = l.label;
    a.href = '#';
    a.addEventListener('click', e => {
      e.stopPropagation();
      e.preventDefault();
      l.open();
      applyNight();
    });
    return a;
  }));

  // Moon phase from a known new moon (2000-01-06 18:14 UTC); 0 = new, .5 = full.
  function moonPhase(d){
    const days = (d.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5;
    const p = (days / 29.530588853) % 1;
    return p < 0 ? p + 1 : p;
  }
  function moonName(p){
    return p < .03 || p > .97 ? 'New moon' : p < .22 ? 'Waxing crescent'
         : p < .28 ? 'First quarter' : p < .47 ? 'Waxing gibbous' : p < .53 ? 'Full moon'
         : p < .72 ? 'Waning gibbous' : p < .78 ? 'Last quarter' : 'Waning crescent';
  }
  // Lit part: outer semicircle on the lit side plus an elliptical terminator.
  function moonPath(p){
    const rx = (10 * Math.abs(Math.cos(2 * Math.PI * p))).toFixed(2);
    const wax = p < .5, crescent = p < .25 || p > .75;
    const outer = wax ? 1 : 0, inner = wax === crescent ? 0 : 1;
    return 'M12 2A10 10 0 0 ' + outer + ' 12 22A' + rx + ' 10 0 0 ' + inner + ' 12 2Z';
  }
  function greeting(h){
    return h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon'
         : h < 21 ? 'Good evening' : 'Good night';
  }

  // Faint twinkling stars, scattered once.
  (function makeStars(){
    const box = document.getElementById('nightStars');
    for(let i = 0; i < 46; i++){
      const st = document.createElement('i');
      const sz = Math.random() < .85 ? 1 : 2;
      st.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;' +
        'width:' + sz + 'px;height:' + sz + 'px;--o:' + (.12 + Math.random() * .3).toFixed(2) + ';' +
        'animation-duration:' + (3 + Math.random() * 6).toFixed(1) + 's;' +
        'animation-delay:-' + (Math.random() * 9).toFixed(1) + 's';
      box.appendChild(st);
    }
  })();
  // Seconds sweep: start the 60s glide in phase with the real clock.
  document.querySelector('#nightSweep b').style.animationDelay =
    '-' + ((Date.now() % 60000) / 1000).toFixed(2) + 's';

  let lastDriftMin = -1;
  function clock(){
    const d = new Date();
    document.getElementById('nightTime').textContent =
      d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/\s?[AP]M$/i, '');
    const p = moonPhase(d);
    document.getElementById('nightDate').textContent =
      d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    document.getElementById('nightMoonName').textContent = moonName(p);
    document.getElementById('nightMoonLit').setAttribute('d', moonPath(p));
    document.getElementById('nightGreetText').textContent = greeting(d.getHours());
    // Wander a little every few minutes so nothing sits in one spot all night.
    const m = Math.floor(d.getTime() / 180000);
    if(m !== lastDriftMin){ lastDriftMin = m; placeNight(true); }
  }

  addEventListener('resize', () => placeNight(false));

  // Position the night block within the free area, sized from the block itself so
  // the big status chips never run off-screen or into the Living Room link.
  // wander=false just pulls it back inside if its size changed (status rows filled in).
  function placeNight(wander){
    const inner = document.getElementById('nightInner');
    const pad = innerHeight * .03;
    const linksTop = document.getElementById('nightLinks').offsetTop || innerHeight;
    const xr = Math.max(0, (innerWidth - inner.offsetWidth) / 2 - pad);
    const bottomGap = innerHeight * .14;  // always leave a clear band above the Living Room link
    const yMin = inner.offsetHeight / 2 + pad, yMax = Math.max(yMin, linksTop - bottomGap - inner.offsetHeight / 2);
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const x = wander ? innerWidth / 2 + (Math.random() * 2 - 1) * xr : clamp(parseFloat(inner.style.left) || innerWidth / 2, innerWidth / 2 - xr, innerWidth / 2 + xr);
    const y = wander ? yMin + Math.random() * (yMax - yMin) : clamp(parseFloat(inner.style.top) || innerHeight / 2, yMin, yMax);
    // Only the periodic wander glides; size corrections snap so the block never
    // drifts in from off-screen.
    inner.style.transition = wander ? '' : 'none';
    inner.style.left = x + 'px';
    inner.style.top = y + 'px';
    if(!wander){ void inner.offsetWidth; inner.style.transition = ''; }
  }

  // --- Confirmation chime for HA button presses ---
  let audioCtx = null;
  function synthChime(){
    try {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [[880, now, 0.09], [1320, now + 0.08, 0.12]].forEach(([freq, start, dur]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(start); osc.stop(start + dur + 0.02);
      });
    } catch(e) { console.error('synthChime failed', e); }
  }
  function playChime(){
    const el = document.getElementById('chimeAudio');
    if(el){
      el.currentTime = 0;
      const p = el.play();
      if(p && p.catch) p.catch(err => { console.error('HTML5 audio play failed, falling back', err); synthChime(); });
    } else {
      synthChime();
    }
  }

  // --- HomeKit state tracking ---
  const SCENE_DEVICES = {
    kitchen:        ['lutron_4', 'lutron_3'],
    kitchen_off:    ['lutron_4', 'lutron_3'],
    relax:          ['hue_8', 'hue_15'],
    meditate:       ['hue_8', 'hue_15'],
    lr_off:         ['hue_8', 'hue_15'],
    shades_open:    ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
    shades_closed:  ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
    shades_partial: ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
  };
  // Immediate commanded on/off per scene (no bri — used until actual snapshot arrives)
  const SCENE_COMMANDED = {
    kitchen:      {lutron_4: {on:true},  lutron_3: {on:true}},
    kitchen_off:  {lutron_4: {on:false}, lutron_3: {on:false}},
    relax:        {hue_8:   {on:true},  hue_15:   {on:true}},
    meditate:     {hue_8:   {on:true},  hue_15:   {on:true}},
    lr_off:       {hue_8:   {on:false}, hue_15:   {on:false}},
    shades_open:  {cover_lr: {on:true},  cover_ll: {on:true},  cover_rr: {on:true},  cover_rl: {on:true}},
    shades_closed:{cover_lr: {on:false}, cover_ll: {on:false}, cover_rr: {on:false}, cover_rl: {on:false}},
    shades_partial:{cover_lr:{on:true},  cover_ll: {on:true},  cover_rr: {on:true},  cover_rl: {on:true}},
  };
  // Curtains take much longer to physically move than lights take to dim
  const SCENE_SETTLE_MS = {
    kitchen_lights: 3500,
    lr_lights:      3500,
    shades:         20000,
  };
  const SCENE_GROUPS = {
    kitchen: 'kitchen_lights', kitchen_off: 'kitchen_lights',
    relax: 'lr_lights', meditate: 'lr_lights', lr_off: 'lr_lights',
    shades_open: 'shades', shades_closed: 'shades', shades_partial: 'shades',
  };

  const expectedState = {};
  const groupTimers = {};     // one pending snapshot timer per scene group
  const activeOverride = {};  // group -> scene key; forces active during settle period
  let hkState = {};

  function snapshotScene(key) {
    const devs = SCENE_DEVICES[key] || [];
    if (!devs.length) return;
    const commanded = SCENE_COMMANDED[key] || {};
    const snap = {};
    devs.forEach(dk => {
      const cmd = commanded[dk];
      if (!cmd) return;
      const d = hkState[dk];
      // Always use COMMANDED on/off — never the actual state at snapshot time
      // This ensures drift detection works even if something changed during the settle window
      snap[dk] = {on: cmd.on};
      // For on-scenes: capture actual brightness to distinguish relax vs meditate
      if (cmd.on && d && d.on) snap[dk].bri = d.bri;
    });
    expectedState[key] = snap;
  }

  function clearGroupExpected(key) {
    const grp = SCENE_GROUPS[key];
    // Cancel pending timer and override for this group
    if (groupTimers[grp]) { clearTimeout(groupTimers[grp]); delete groupTimers[grp]; }
    delete activeOverride[grp];
    Object.keys(SCENE_GROUPS).forEach(k => {
      if (SCENE_GROUPS[k] === grp) delete expectedState[k];
    });
  }

  function deviceMatches(current, expected) {
    if (!current || !expected) return false;
    if (current.on !== expected.on) return false;
    if (current.on && expected.bri != null && Math.abs((current.bri || 0) - expected.bri) > 5) return false;
    return true;
  }

  function updateSceneButtons() {
    document.querySelectorAll('.scene-btn').forEach(btn => {
      const key = btn.dataset.scene;
      const devs = SCENE_DEVICES[key] || [];
      const grp = SCENE_GROUPS[key];
      const exp = expectedState[key];
      btn.classList.remove('active', 'any-on');
      if (!devs.length) return;
      if (devs.some(dk => hkState[dk] && hkState[dk].on)) btn.classList.add('any-on');
      // During settle period, hold the pressed button active regardless of hkState
      if (activeOverride[grp] === key) { btn.classList.add('active'); return; }
      if (exp && devs.every(dk => deviceMatches(hkState[dk], exp[dk]))) btn.classList.add('active');
    });
  }

  function updateRightbar() {
    document.querySelectorAll('.status-tile[data-key]').forEach(tile => {
      const key = tile.dataset.key;
      const d = hkState[key];
      tile.classList.remove('locked', 'unlocked', 'charging', 'dev-on');
      const stateEl = tile.querySelector('.tile-state');
      if (!d) { stateEl.textContent = '—'; return; }
      if (key === 'lock_front') {
        tile.classList.add(d.on ? 'locked' : 'unlocked');
        stateEl.textContent = d.on ? 'Locked' : 'Unlocked';
      } else if (key === 'garage') {
        tile.classList.add(d.on ? 'unlocked' : 'locked');
        stateEl.textContent = d.on ? 'Open' : 'Closed';
      } else if (key === 'charge') {
        if (d.on) { tile.classList.add('charging'); stateEl.textContent = 'Charging'; }
        else { stateEl.textContent = 'No Charging'; }
      } else if (key === 'bedroom') {
        if (d.on) { tile.classList.add('dev-on'); stateEl.textContent = 'On'; }
        else { stateEl.textContent = 'Off'; }
      }
    });
  }

  document.querySelectorAll('.status-tile.clickable').forEach(tile => {
    tile.addEventListener('click', () => {
      playChime();
      const key = tile.dataset.key;
      const service = (hkState[key] && hkState[key].on) ? 'turn_off' : 'turn_on';
      if (hkState[key]) hkState[key] = {...hkState[key], on: service === 'turn_on'};
      updateRightbar();
      fetch('/action/ha/' + key + '/' + service, {method:'POST'}).catch(()=>{});
    });
  });

  // Living Room HA Controller (separate app on :8095) in a full-screen overlay,
  // so Fully Kiosk never navigates away from the panel. Iframe loads on first open.
  const LR_URL = 'http://' + location.hostname + ':8095/';
  const lrOverlay = document.getElementById('lrOverlay');
  document.getElementById('lrOpen').addEventListener('click', () => {
    playChime();
    if (!lrOverlay.querySelector('iframe')) {
      const f = document.createElement('iframe');
      f.src = LR_URL;
      lrOverlay.appendChild(f);
    }
    lrOverlay.classList.add('show');
    lrIdleSince = Date.now();
  });
  document.getElementById('lrClose').addEventListener('click', () => {
    lrOverlay.classList.remove('show');
    applyNight();
  });
  // The controller's "Night Screen" link asks us to go dark instead of navigating;
  // it also pings panel:activity on touches so we know it's in use.
  window.addEventListener('message', e => {
    if(e.origin !== new URL(LR_URL).origin || !e.data) return;
    if(e.data.type === 'panel:activity'){ lrIdleSince = Date.now(); return; }
    if(e.data.type !== 'panel:night') return;
    lrOverlay.classList.remove('show');
    enterNight();
  });
  // Music stopped and nobody has touched the overlay for LR_IDLE_MS: back to dark.
  // The idle clock only starts once the music has stopped.
  let lrIdleSince = Date.now();
  setInterval(() => {
    if(!lrOverlay.classList.contains('show') || !feedNight){ lrIdleSince = Date.now(); return; }
    if(Date.now() - lrIdleSince < LR_IDLE_MS) return;
    lrOverlay.classList.remove('show');
    wakeUntil = 0;
    applyNight();
  }, 5000);

  async function pollHomeKit() {
    try {
      const s = await (await fetch('/api/homekit', {cache:'no-store'})).json();
      hkState = s;
      updateSceneButtons();
      updateRightbar();
      updateNightHome();
    } catch(e) {}
  }

  function fireScene(btn){
    playChime();
    const key = btn.dataset.scene;
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 400);
    fetch('/action/scene/' + key, {method:'POST'}).catch(()=>{});

    // Clear group (cancels pending timer + override), then hold this button active during settle
    clearGroupExpected(key);
    const grp = SCENE_GROUPS[key];
    if (SCENE_COMMANDED[key]) expectedState[key] = SCENE_COMMANDED[key];
    activeOverride[grp] = key;
    updateSceneButtons();

    // After scene settles: drop override, fresh poll, refine snapshot with actual state
    groupTimers[grp] = setTimeout(async () => {
      delete groupTimers[grp];
      delete activeOverride[grp];
      await pollHomeKit();
      snapshotScene(key);
      updateSceneButtons();
    }, SCENE_SETTLE_MS[grp] || 3500);
  }
  document.querySelectorAll('.scene-btn').forEach(b => {
    b.addEventListener('click', () => fireScene(b));
  });

  poll(); setInterval(poll, POLL_MS);
  pollHomeKit(); setInterval(pollHomeKit, 3000);
  clock(); setInterval(clock, 5000);
</script>
</body>
</html>
