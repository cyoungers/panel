<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now Playing</title>
<style>
  :root { --gap: 4vmin; --fg: #f2f2f4; --muted: #9aa0aa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #0a0a0c; color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
  }
  #bg {
    position: fixed; inset: -8%; background-size: cover;
    background-position: center; transform: scale(1.1);
    filter: blur(40px) saturate(1.3) brightness(0.5);
    transition: background-image .6s ease; z-index: 0;
  }
  #bg::after { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.2), rgba(0,0,0,.7)); }
  #stage {
    position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; gap: var(--gap); padding: var(--gap);
  }
  #coverWrap {
    height: 100%; aspect-ratio: 1/1; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  #cover {
    max-height: 100%; max-width: 100%; aspect-ratio: 1/1;
    object-fit: contain; border-radius: 2vmin;
    box-shadow: 0 1vmin 4vmin rgba(0,0,0,.6);
    transition: opacity .5s ease; background: #1a1a1f;
  }
  #info {
    flex: 1 1 auto; min-width: 0; height: 100%;
    display: flex; flex-direction: column; padding: 2vmin 1vmin;
  }
  #feed { font-size: 2.4vmin; letter-spacing: .25em;
          text-transform: uppercase; color: var(--muted); }
  #feedrow { display: flex; align-items: center; gap: 2vmin; }
  #playstate { font-size: 2vmin; letter-spacing: .15em; text-transform: uppercase; }
  #playstate.playing { color: #5fae8c; }
  #playstate.paused { color: #f2b705; font-weight: 600; }
  #artist { font-size: 5.5vmin; font-weight: 700; line-height: 1.05; margin-top: 1vmin; }
  #title { font-size: 4vmin; font-weight: 400; color: #d2d4da; margin-top: 1vmin; }
  #album { font-size: 2.8vmin; color: var(--muted); margin-top: 1.5vmin; }
  #details { font-size: 2.4vmin; color: #6f757f; margin-top: 0.6vmin;
             letter-spacing: .03em; }
  #description { font-size: 2.4vmin; color: #c2c6cf; line-height: 1.5;
                 margin-top: 2.4vmin; max-width: 56vmin; white-space: pre-line; }
  .spacer { flex: 1 1 auto; }
  #ratingRow { display: flex; align-items: baseline; gap: 1.2vmin;
               font-size: 2.6vmin; color: var(--muted); }
  .rlabel { letter-spacing: .04em; }
  #ratingVal { color: var(--fg); font-weight: 600; font-size: 3.6vmin; }
  .rsub { font-size: 2.2vmin; color: #6f757f; margin-left: 1.5vmin; }
  #ratingChart { display: flex; align-items: flex-end; gap: 0.6vmin;
                 height: 8vmin; width: 40vmin; max-width: 100%; margin-bottom: 1.6vmin; }
  #ratingChart .bar { flex: 1 1 0; min-height: 2%; border-radius: 0.4vmin 0.4vmin 0 0; }
  #controls { display: none; gap: 2vmin; margin-top: 3vmin; }
  #rightbar {
    flex: 0 0 auto; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
    gap: 1.5vmin; padding: 1.6vmin 1vmin;
    width: 15vmin;
    background: rgba(12,12,16,.78);
    border-left: 1px solid rgba(255,255,255,.07);
  }
  .status-tile {
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7vmin; padding: 1.3vmin 0.4vmin;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.6vmin; color: #8b909a; font: inherit; cursor: default;
  }
  .status-tile.clickable { cursor: pointer; transition: background .12s ease, transform .1s ease; }
  .status-tile.clickable:active { transform: scale(.94); }
  .status-tile svg { width: 5vmin; height: 5vmin; stroke: currentColor; fill: none;
                     stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .status-tile .tile-lbl { font-size: 1.7vmin; letter-spacing: .02em; color: #8b909a; }
  .status-tile .tile-state { font-size: 1.9vmin; font-weight: 600; color: #8b909a; }
  .status-tile.locked { color: #5fae8c; }
  .status-tile.locked .tile-lbl { color: #c2c6cf; }
  .status-tile.locked .tile-state { color: #5fae8c; }
  .status-tile.unlocked { color: #f2b705; border-color: rgba(242,183,5,.45); }
  .status-tile.unlocked .tile-lbl { color: #c2c6cf; }
  .status-tile.unlocked .tile-state { color: #f2b705; }
  .status-tile.charging { color: #f2b705; }
  .status-tile.charging .tile-lbl { color: #c2c6cf; }
  .status-tile.charging .tile-state { color: #f2b705; }
  .status-tile.dev-on { color: #d9dce2; background: rgba(95,174,140,.18); border-color: rgba(95,174,140,.55); }
  .status-tile.dev-on .tile-lbl { color: #9de0c0; }
  .status-tile.dev-on .tile-state { color: #9de0c0; }
  #idle {
    position: absolute; inset: 0; z-index: 2; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 2vmin; background: #0a0a0c; color: var(--muted); transition: opacity .6s ease;
  }
  #idle.hidden { opacity: 0; pointer-events: none; }
  #idleTitle { font-size: 4vmin; letter-spacing: .15em; }
  #clock { font-size: 9vmin; font-weight: 200; color: #34343c; }
  #scenebar {
    flex: 0 0 auto; z-index: 3;
    display: flex; align-items: stretch; justify-content: center; gap: 3vmin;
    padding: 1.6vmin 2vmin;
    background: rgba(12,12,16,.78);
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .scene-group { display: flex; gap: 1.4vmin; }
  .scene-group + .scene-group {
    border-left: 1px solid rgba(255,255,255,.12); padding-left: 3vmin; }
  .scene-btn {
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7vmin; width: 14.5vmin; padding: 1.3vmin 0.4vmin;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.6vmin; color: #d9dce2; cursor: pointer; font: inherit;
    transition: background .12s ease, transform .1s ease, border-color .12s ease;
  }
  .scene-btn:active { transform: scale(.94); }
  .scene-btn.flash { background: rgba(95,174,140,.45); border-color: rgba(95,174,140,.75); }
  .scene-btn.active { background: rgba(95,174,140,.18); border-color: rgba(95,174,140,.55); }
  .scene-btn.active .lbl { color: #9de0c0; }
  .scene-btn svg { width: 5vmin; height: 5vmin; stroke: currentColor; fill: none;
                   stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* default: grey bulb (devices off or unknown) */
  .scene-btn { color: #8b909a; }
  .scene-btn .lbl { font-size: 1.9vmin; letter-spacing: .02em; color: #8b909a; }
  /* any device in scene is on: white bulb */
  .scene-btn.any-on { color: #d9dce2; }
  .scene-btn.any-on .lbl { color: #c2c6cf; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="stage">
    <div id="coverWrap"><img id="cover" alt=""></div>
    <div id="info">
      <div id="feedrow">
        <div id="feed"></div>
        <div id="playstate"></div>
      </div>
      <div id="artist"></div>
      <div id="title"></div>
      <div id="album"></div>
      <div id="details"></div>
      <div id="description"></div>
      <div class="spacer"></div>
      <div id="ratingChart"></div>
      <div id="ratingRow">
        <span class="rlabel">Your rating</span>
        <span id="ratingVal">&mdash;</span>
        <span id="avgWrap" class="rsub"></span>
      </div>
      <div id="controls"><!-- rating + control buttons added later --></div>
    </div>
    <div id="rightbar">
      <div class="status-tile" data-key="lock_front">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="tile-lbl">Front Door</span>
        <span class="tile-state">—</span>
      </div>
      <div class="status-tile" data-key="garage">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
        <span class="tile-lbl">Garage</span>
        <span class="tile-state">—</span>
      </div>
      <div class="status-tile" data-key="charge">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span class="tile-lbl">Car</span>
        <span class="tile-state">—</span>
      </div>
      <button class="status-tile clickable" data-key="bedroom">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="tile-lbl">Bedroom</span>
        <span class="tile-state">—</span>
      </button>
    </div>
    <div id="idle">
      <div id="idleTitle">RADIO PARADISE</div>
      <div id="clock"></div>
    </div>
  </div>
  <div id="scenebar">
    <div class="scene-group">
      <button class="scene-btn" data-scene="kitchen">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">Kitchen</span>
      </button>
      <button class="scene-btn" data-scene="kitchen_off">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        <span class="lbl">Kitchen Off</span>
      </button>
      <button class="scene-btn" data-scene="relax">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">LR Relax</span>
      </button>
      <button class="scene-btn" data-scene="meditate">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">LR Meditate</span>
      </button>
      <button class="scene-btn" data-scene="lr_off">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A6 6 0 0 0 12 3z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        <span class="lbl">LR Off</span>
      </button>
    </div>
    <div class="scene-group">
      <button class="scene-btn" data-scene="shades_open">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="2.5" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="6.5" x2="19" y2="6.5" stroke-width="2"/></svg>
        <span class="lbl">Open</span>
      </button>
      <button class="scene-btn" data-scene="shades_closed">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="15" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="19" x2="19" y2="19" stroke-width="2"/></svg>
        <span class="lbl">Closed</span>
      </button>
      <button class="scene-btn" data-scene="shades_partial">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><rect x="5" y="4" width="14" height="8" fill="currentColor" fill-opacity=".4" stroke="none"/><line x1="5" y1="12" x2="19" y2="12" stroke-width="2"/></svg>
        <span class="lbl">Partial</span>
      </button>
    </div>
  </div>
<script>
  const POLL_MS = 3000;
  const STALE_MS = 90 * 60 * 1000;   // beyond this, fall back to idle screen
  let lastCover = null;

  function setBg(url){
    document.getElementById('bg').style.backgroundImage = 'url("' + url + '")';
  }

  function setText(id, val){
    const el = document.getElementById(id);
    el.textContent = val || '';
    el.style.display = val ? '' : 'none';
  }

  let lastDist = '';
  function renderChart(dist){
    const el = document.getElementById('ratingChart');
    if(!dist || !dist.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    const max = Math.max.apply(null, dist.map(d => d.count || 0)) || 1;
    el.innerHTML = dist.map(d => {
      const h = Math.max(2, Math.round((d.count || 0) / max * 100));
      return '<div class="bar" style="height:' + h + '%;background-color:'
        + (d.color || '#888') + '"></div>';
    }).join('');
  }

  async function poll(){
    let s;
    try { s = await (await fetch('/nowplaying', {cache:'no-store'})).json(); }
    catch(e){ return; }
    const idle = document.getElementById('idle');
    const ageMs = (s && s.updated_at) ? (Date.now() - s.updated_at * 1000) : Infinity;
    const live = s && s.cover_url && ageMs < STALE_MS;
    if(!live){
      if(!lastCover) idle.classList.remove('hidden');  // Option C: keep last art if we had it
      return;
    }
    idle.classList.add('hidden');
    if(s.cover_url !== lastCover){
      const img = document.getElementById('cover');
      img.style.opacity = 0;
      const next = new Image();
      next.onload = () => { img.src = s.cover_url; setBg(s.cover_url); img.style.opacity = 1; };
      next.src = s.cover_url;
      lastCover = s.cover_url;
    }
    setText('feed', s.feed);
    const ps = document.getElementById('playstate');
    if (s.playing === true) {
      ps.textContent = '\u25B6 Playing'; ps.className = 'playing'; ps.style.display = '';
    } else if (s.playing === false) {
      ps.textContent = '\u23F8 Paused'; ps.className = 'paused'; ps.style.display = '';
    } else {
      ps.style.display = 'none';
    }
    setText('artist', s.artist);
    setText('title', s.title);
    setText('album', s.album);
    const det = [s.released, s.length].filter(Boolean).join('  \u00b7  ');
    setText('details', det);
    setText('description', s.description);
    const r = s.rating;
    document.getElementById('ratingVal').textContent =
      (r === null || r === '' || r === undefined) ? '\u2014' : r;
    const avg = s.avg_rating
      ? ('avg ' + s.avg_rating + (s.num_ratings ? ' (' + s.num_ratings + ')' : ''))
      : '';
    document.getElementById('avgWrap').textContent = avg;
    const hasRating = !(r === null || r === '' || r === undefined);
    document.getElementById('ratingRow').style.display =
      (hasRating || s.avg_rating) ? '' : 'none';
    const distKey = JSON.stringify(s.rating_dist || []);
    if(distKey !== lastDist){ renderChart(s.rating_dist); lastDist = distKey; }
  }

  function clock(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  // --- HomeKit state tracking ---
  const SCENE_DEVICES = {
    kitchen:        ['lutron_4', 'lutron_3'],
    kitchen_off:    ['lutron_4', 'lutron_3'],
    relax:          ['hue_8', 'hue_15'],
    meditate:       ['hue_8', 'hue_15'],
    lr_off:         ['hue_8', 'hue_15'],
    shades_open:    ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
    shades_closed:  ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
    shades_partial: ['cover_lr', 'cover_ll', 'cover_rr', 'cover_rl'],
  };
  // Immediate commanded on/off per scene (no bri — used until actual snapshot arrives)
  const SCENE_COMMANDED = {
    kitchen:      {lutron_4: {on:true},  lutron_3: {on:true}},
    kitchen_off:  {lutron_4: {on:false}, lutron_3: {on:false}},
    relax:        {hue_8:   {on:true},  hue_15:   {on:true}},
    meditate:     {hue_8:   {on:true},  hue_15:   {on:true}},
    lr_off:       {hue_8:   {on:false}, hue_15:   {on:false}},
    shades_open:  {cover_lr: {on:true},  cover_ll: {on:true},  cover_rr: {on:true},  cover_rl: {on:true}},
    shades_closed:{cover_lr: {on:false}, cover_ll: {on:false}, cover_rr: {on:false}, cover_rl: {on:false}},
    shades_partial:{cover_lr:{on:true},  cover_ll: {on:true},  cover_rr: {on:true},  cover_rl: {on:true}},
  };
  // Curtains take much longer to physically move than lights take to dim
  const SCENE_SETTLE_MS = {
    kitchen_lights: 3500,
    lr_lights:      3500,
    shades:         20000,
  };
  const SCENE_GROUPS = {
    kitchen: 'kitchen_lights', kitchen_off: 'kitchen_lights',
    relax: 'lr_lights', meditate: 'lr_lights', lr_off: 'lr_lights',
    shades_open: 'shades', shades_closed: 'shades', shades_partial: 'shades',
  };

  const expectedState = {};
  const groupTimers = {};     // one pending snapshot timer per scene group
  const activeOverride = {};  // group -> scene key; forces active during settle period
  let hkState = {};

  function snapshotScene(key) {
    const devs = SCENE_DEVICES[key] || [];
    if (!devs.length) return;
    const commanded = SCENE_COMMANDED[key] || {};
    const snap = {};
    devs.forEach(dk => {
      const cmd = commanded[dk];
      if (!cmd) return;
      const d = hkState[dk];
      // Always use COMMANDED on/off — never the actual state at snapshot time
      // This ensures drift detection works even if something changed during the settle window
      snap[dk] = {on: cmd.on};
      // For on-scenes: capture actual brightness to distinguish relax vs meditate
      if (cmd.on && d && d.on) snap[dk].bri = d.bri;
    });
    expectedState[key] = snap;
  }

  function clearGroupExpected(key) {
    const grp = SCENE_GROUPS[key];
    // Cancel pending timer and override for this group
    if (groupTimers[grp]) { clearTimeout(groupTimers[grp]); delete groupTimers[grp]; }
    delete activeOverride[grp];
    Object.keys(SCENE_GROUPS).forEach(k => {
      if (SCENE_GROUPS[k] === grp) delete expectedState[k];
    });
  }

  function deviceMatches(current, expected) {
    if (!current || !expected) return false;
    if (current.on !== expected.on) return false;
    if (current.on && expected.bri != null && Math.abs((current.bri || 0) - expected.bri) > 5) return false;
    return true;
  }

  function updateSceneButtons() {
    document.querySelectorAll('.scene-btn').forEach(btn => {
      const key = btn.dataset.scene;
      const devs = SCENE_DEVICES[key] || [];
      const grp = SCENE_GROUPS[key];
      const exp = expectedState[key];
      btn.classList.remove('active', 'any-on');
      if (!devs.length) return;
      if (devs.some(dk => hkState[dk] && hkState[dk].on)) btn.classList.add('any-on');
      // During settle period, hold the pressed button active regardless of hkState
      if (activeOverride[grp] === key) { btn.classList.add('active'); return; }
      if (exp && devs.every(dk => deviceMatches(hkState[dk], exp[dk]))) btn.classList.add('active');
    });
  }

  function updateRightbar() {
    document.querySelectorAll('.status-tile').forEach(tile => {
      const key = tile.dataset.key;
      const d = hkState[key];
      tile.classList.remove('locked', 'unlocked', 'charging', 'dev-on');
      const stateEl = tile.querySelector('.tile-state');
      if (!d) { stateEl.textContent = '—'; return; }
      if (key === 'lock_front') {
        tile.classList.add(d.on ? 'locked' : 'unlocked');
        stateEl.textContent = d.on ? 'Locked' : 'Unlocked';
      } else if (key === 'garage') {
        tile.classList.add(d.on ? 'unlocked' : 'locked');
        stateEl.textContent = d.on ? 'Open' : 'Closed';
      } else if (key === 'charge') {
        if (d.on) { tile.classList.add('charging'); stateEl.textContent = 'Charging'; }
        else { stateEl.textContent = 'No Charging'; }
      } else if (key === 'bedroom') {
        if (d.on) { tile.classList.add('dev-on'); stateEl.textContent = 'On'; }
        else { stateEl.textContent = 'Off'; }
      }
    });
  }

  document.querySelectorAll('.status-tile.clickable').forEach(tile => {
    tile.addEventListener('click', () => {
      const key = tile.dataset.key;
      const service = (hkState[key] && hkState[key].on) ? 'turn_off' : 'turn_on';
      if (hkState[key]) hkState[key] = {...hkState[key], on: service === 'turn_on'};
      updateRightbar();
      fetch('/action/ha/' + key + '/' + service, {method:'POST'}).catch(()=>{});
    });
  });

  async function pollHomeKit() {
    try {
      const s = await (await fetch('/api/homekit', {cache:'no-store'})).json();
      hkState = s;
      updateSceneButtons();
      updateRightbar();
    } catch(e) {}
  }

  function fireScene(btn){
    const key = btn.dataset.scene;
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 400);
    fetch('/action/scene/' + key, {method:'POST'}).catch(()=>{});

    // Clear group (cancels pending timer + override), then hold this button active during settle
    clearGroupExpected(key);
    const grp = SCENE_GROUPS[key];
    if (SCENE_COMMANDED[key]) expectedState[key] = SCENE_COMMANDED[key];
    activeOverride[grp] = key;
    updateSceneButtons();

    // After scene settles: drop override, fresh poll, refine snapshot with actual state
    groupTimers[grp] = setTimeout(async () => {
      delete groupTimers[grp];
      delete activeOverride[grp];
      await pollHomeKit();
      snapshotScene(key);
      updateSceneButtons();
    }, SCENE_SETTLE_MS[grp] || 3500);
  }
  document.querySelectorAll('.scene-btn').forEach(b => {
    b.addEventListener('click', () => fireScene(b));
  });

  poll(); setInterval(poll, POLL_MS);
  pollHomeKit(); setInterval(pollHomeKit, 3000);
  clock(); setInterval(clock, 10000);
</script>
</body>
</html>
